[package]
name = "rawblow-app"
version.workspace = true
edition.workspace = true
publish = false
description = "RawBlow: fast photo culling viewer (egui/wgpu GUI)"
default-run = "rawblow"
build = "build.rs"

[[bin]]
name = "rawblow"
path = "src/main.rs"

[features]
# 새 릴리즈 안내(#33): GitHub Releases API 확인용 HTTP(ureq/rustls). 기본 on.
# rustls(ring)는 C 컴파일이 필요해 cc 없는 환경에선 `--no-default-features`로 끄고
# 나머지를 cargo check 한다(실 빌드는 Windows에서 기능 켠 채 수행).
default = ["update-check", "model-download", "ai"]
update-check = ["dep:ureq"]
# AI 모델 자동 다운로드(CLIP-IQA ONNX, #50). update-check와 동일 HTTP 스택 공유.
model-download = ["dep:ureq", "dep:sha2"]
# ONNX 추론(#50): rawblow-core/ai(ort) 활성화. cc 없는 환경에서는 --no-default-features로 끌 수 있다.
ai = ["rawblow-core/ai"]

# Windows: 로고를 .exe 파일 아이콘(탐색기/작업표시줄)으로 임베드.
[target.'cfg(windows)'.build-dependencies]
ico = "0.3"
winresource = "0.1"

# macOS: .app 번들 없이 실행되는 단독 바이너리에서도 NSOpenPanel 등 AppKit 다이얼로그가
# 시스템 언어를 따르도록(이슈 #12) Objective-C 런타임을 통해 NSUserDefaults 조정.
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[dependencies]
rawblow-core = { path = "../rawblow-core" }
# GPS 미니 지도(#38): OSM 타일 PNG 디코드용(코어와 같은 image, png만).
image = { version = "0.25", default-features = false, features = ["png"] }
# glow(OpenGL 백엔드)는 빼고 wgpu만. winit 백엔드(x11/wayland)는 반드시 포함해야 함.
eframe = { version = "0.29", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui = "0.29"
crossbeam-channel = "0.5"
# 헤드리스 빌드를 위해 GTK 비의존 xdg-portal 백엔드 사용
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
# 새 릴리즈 안내(#33): 가벼운 동기 HTTP + 순수 Rust TLS(rustls, 루트 인증서 번들).
# 단독 바이너리 철학 유지(tokio 불필요). optional — update-check 기능에서만 빌드.
ureq = { version = "2", default-features = false, features = ["tls"], optional = true }
# sha256 검증(모델 다운로드, #50).
sha2 = { version = "0.10", optional = true }
