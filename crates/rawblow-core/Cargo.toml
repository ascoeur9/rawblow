[package]
name = "rawblow-core"
version.workspace = true
edition.workspace = true
publish = false
description = "RawBlow core: scan, decode, exif, sidecar, transfer, color — GUI-independent"

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp", "bmp"] }
# JPEG는 jpeg-decoder로 직접 디코딩(DCT 1/2·1/4·1/8 축소 디코딩 → IDCT 비용 대폭 절감).
jpeg-decoder = "0.3"
kamadak-exif = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
qcms = { version = "0.3", optional = true }
imagepipe = { version = "0.5", optional = true }
# AI 미적 점수(#50, 선택). ONNX Runtime. download-binaries로 플랫폼별 prebuilt 자동 다운로드.
# GPU 가속은 OS별 분기(아래 target 의존성): macOS=CoreML(`none` prebuilt에 포함),
# Windows=WebGPU(`wgpu` prebuilt). Linux는 CPU. EP 등록 실패는 비치명적 → CPU 폴백.
ort = { version = "=2.0.0-rc.12", features = ["download-binaries"], optional = true }

# GPU EP는 OS별 분기. 같은 optional `ort`에 feature를 합집합으로 더한다(ai 피처가 dep:ort를 켤 때 함께 활성).
# macOS: CoreML(Apple GPU+ANE). `coreml`은 prebuilt 변형을 바꾸지 않아 `none` 빌드(=CoreML 포함)를 받는다.
[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.12", features = ["coreml"], optional = true }

# Windows: WebGPU(D3D12/Vulkan — 모든 GPU). `webgpu`는 `wgpu` prebuilt 변형을 받는다.
[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "=2.0.0-rc.12", features = ["webgpu"], optional = true }

[features]
default = ["color", "fullraw"]
# ICC 컬러 매니지먼트(qcms). 빌드 불가 환경에서 끌 수 있음 → sRGB 패스스루로 폴백.
color = ["dep:qcms"]
# 풀 RAW 디코딩(imagepipe: rawloader 기반 sRGB 현상). 임베디드 프리뷰만으로 충분하면 끌 수 있음.
fullraw = ["dep:imagepipe"]
# AI 미적/구도 점수(NIMA ONNX). 노출·초점·기울기는 이 기능 없이도 동작(순수 CV).
ai = ["dep:ort"]

[dev-dependencies]
tempfile = "3"
# 합성 JPEG 생성용(DCT 축소 디코딩 회귀 테스트). 샘플 사진 없이 결정적으로 검증.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# 스크롤 응답성 시뮬레이터(scroll_sim) 예제용 — 워커의 다중 레인 select를 재현.
crossbeam-channel = "0.5"
