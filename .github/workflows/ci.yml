# 코어 테스트 + 앱 타입체크·테스트 + clippy(-D warnings).
#
# PR과 main 푸시에서 게이트한다(#104). ai/ort는 빌드 시 바이너리 다운로드가 커서 생략.
# cargo fmt --check는 rustfmt 미적용 저장소라 넣지 않는다.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux · test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test rawblow-core (color+fullraw)
        run: cargo test -p rawblow-core
      - name: Test rawblow-app (no ai)
        run: cargo test -p rawblow-app --no-default-features --features update-check,model-download
      - name: Clippy core (shipping features)
        run: cargo clippy -p rawblow-core --all-targets -- -D warnings
      - name: Clippy app (no ai)
        run: cargo clippy -p rawblow-app --no-default-features --features update-check,model-download --all-targets -- -D warnings

  macos:
    name: macOS · check app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check rawblow-app (no ai)
        run: cargo check -p rawblow-app --no-default-features --features update-check,model-download
      - name: Test rawblow-core
        run: cargo test -p rawblow-core

  windows:
    name: Windows · test + check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test rawblow-core
        run: cargo test -p rawblow-core
      - name: Check rawblow-app (no ai)
        run: cargo check -p rawblow-app --no-default-features --features update-check,model-download
