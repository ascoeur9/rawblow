# 테스트와 배포 빌드는 로컬에서 한다 (BUILD.md, scripts/).
# GitHub Actions로 릴리즈를 만들지 않고, Linux 산출물도 없다.
# PR/push 자동 실행 없음. 출하 OS에서 컴파일만 원격으로 보고 싶을 때
# Actions 탭 → Run workflow.
name: CI

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS · check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check rawblow-app (no ai)
        run: cargo check -p rawblow-app --no-default-features --features update-check,model-download

  windows:
    name: Windows · check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check rawblow-app (no ai)
        run: cargo check -p rawblow-app --no-default-features --features update-check,model-download
